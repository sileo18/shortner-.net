services:
  redis:
    image: redis:7-alpine
    container_name: url-shortner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - url-shortner-net

  api:
    build: .
    container_name: url-shortner-api
    ports:
      - "80:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - url-shortner-net

volumes:
  redis-data:

networks:
  url-shortner-net:
    driver: bridge
