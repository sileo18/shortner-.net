name: Deploy to Azure VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build and Push Docker Image
        run: |
          echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
          docker build -t ${{ secrets.DOCKER_USER }}/url-shortner:latest .
          docker push ${{ secrets.DOCKER_USER }}/url-shortner:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 10m
          script: |
            cd /home/${{ secrets.VM_USER }}/url-shortner
            docker pull ${{ secrets.DOCKER_USER }}/url-shortner:latest
            docker-compose down
            docker-compose up -d
            docker image prune -f